# How often each source type runs (minutes). Workday is the fastest
# signal, so it runs every pass (~5 min on GitHub Actions).
every_min:
  workday: 0
  greenhouse: 0
  lever: 0
  oracle_hcm: 0
  html: 10
  linkedin: 0        # rotates through queries, a few per pass
  simplify: 30

