  # the first run's health report tells you if it works.
  - {name: J.P. Morgan, host: jpmc.fa.oraclecloud.com, site: CX_1001, keywords: ["summer analyst", "internship"]}

# Server-rendered career pages. The bot pulls every link whose text looks
# like an internship. link_pattern catches job links buried in page JSON.
html:
  - {name: Citi,          url: "https://jobs.citi.com/search-jobs/summer%20analyst"}
  - {name: Citi (intern), url: "https://jobs.citi.com/search-jobs/internship"}
  - {name: Scotiabank,    url: "https://jobs.scotiabank.com/search/?q=summer&sortColumn=referencedate&sortDirection=desc"}
  - {name: Scotiabank 2027, url: "https://jobs.scotiabank.com/search/?q=2027&sortColumn=referencedate&sortDirection=desc"}
  - {name: National Bank, url: "https://emplois.bnc.ca/en_CA/careers/CIB_Internship"}
  - {name: Rothschild & Co, url: "https://www.rothschildandco.com/en/careers/students-and-graduates/opportunities/"}
  - {name: RBC,           url: "https://jobs.rbc.com/ca/en/search-results?keywords=summer%202027", link_pattern: 'https://jobs\.rbc\.com/ca/en/job/[A-Za-z0-9\-_/]+'}
  - {name: RBC 2028,      url: "https://jobs.rbc.com/ca/en/search-results?keywords=2028", link_pattern: 'https://jobs\.rbc\.com/ca/en/job/[A-Za-z0-9\-_/]+'}
  - {name: Macquarie,     url: "https://recruitment.macquarie.com/en_US/careers/SearchJobs/?search=intern"}

# ── The "whole internet" net: LinkedIn public job search ──
# Catches boutiques and every bank not listed above. Each pass runs a few
# query/location combos and rotates, so everything is covered roughly
# every 30-40 minutes without getting rate-limited.
linkedin:
  per_pass: 6
  urgent_queries:            # run twice as often
    - "investment banking summer analyst 2028"
    - "2028 summer analyst"
    - "M&A summer analyst 2028"
  queries:
    - "summer analyst 2027"
    - "investment banking intern 2027"
    - "M&A intern summer 2027"
    - "capital markets summer 2027 intern"
    - "corporate finance intern summer 2027"
    - "private equity summer intern 2027"
    - "equity research summer intern 2027"
  locations:
    - "Toronto, Ontario, Canada"
    - "Canada"
    - "Hong Kong SAR"
    - "Singapore"
    - "London, England, United Kingdom"
    - "United Kingdom"

# ── Aggregator: Simplify's public internship list (updated hourly) ──
simplify:
  url: "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json"
